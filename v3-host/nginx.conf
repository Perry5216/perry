map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 4847;
    server_name _;

    location /perry-skin/ {
        alias /brand/;
        add_header Cache-Control "no-cache";
    }

    location = /favicon.svg {
        alias /brand/favicon.svg;
        add_header Cache-Control "no-cache";
        default_type image/svg+xml;
    }

    location = /manifest.webmanifest {
        alias /brand/manifest.webmanifest;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;

        sub_filter '<title>DeepSeek Harness</title>' '<title>Perry</title>';
        sub_filter '</head>' '<link rel="stylesheet" href="/perry-skin/skin.css"><script src="/perry-skin/skin.js" defer></script></head>';
        sub_filter_once off;
        sub_filter_types text/html;
    }
}
